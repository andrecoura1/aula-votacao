<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Votação da aula</title>
<style>
:root{--bg:#15171C;--card:#1E2128;--card2:#262A32;--ink:#F2F3F5;--muted:#A3AAB6;--line:#2E333C;--hl:#F3D34A;--pen:#9DB2FF;--ok:#2BB86B;--no:#E5584B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:22px 16px 40px;min-height:100svh;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)}.dot.off{background:var(--no)}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em}
.sub{font-size:17px;color:var(--muted);margin:0;line-height:1.4}
.timer{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1;color:var(--hl)}
.timer small{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:26px 8px;font-family:inherit;font-weight:800;font-size:72px;line-height:1;cursor:pointer;transition:transform .1s,border-color .15s,background .15s}
.opt small{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:10px}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--hl);background:#3A3417}
.opt:disabled{opacity:.45}
.opt.right{border-color:var(--ok);background:#173326;opacity:1}
.opt.wrong{border-color:var(--no);background:#3A1F1C;opacity:1}
.msg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;font-size:19px;line-height:1.45;text-align:center}
.msg b{display:block;font-size:26px;margin-bottom:6px}
.score{display:flex;gap:8px;justify-content:center}
.score i{width:36px;height:10px;border-radius:5px;background:var(--card2)}
.score i.ok{background:var(--ok)}.score i.no{background:var(--no)}.score i.nv{background:#5A6170}
.foot{margin-top:auto;font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><span id="title">Votação da aula</span><span><span class="dot" id="dot"></span><span id="conn">conectando…</span></span></div>

  <section id="vWait">
    <div class="msg"><b>Você está dentro ✓</b>Deixe esta página aberta. Quando o apresentador abrir uma rodada, os botões aparecem aqui.</div>
  </section>

  <section id="vOpen" hidden style="display:flex;flex-direction:column;gap:18px">
    <h1 id="q">Qual é a falsa?</h1>
    <p class="sub" id="qsub"></p>
    <div class="timer"><span id="secs">30</span><small>segundos</small></div>
    <div class="opts" id="opts"></div>
    <p class="sub" id="voted" style="text-align:center" hidden>Voto registrado. Pode trocar até o tempo acabar.</p>
  </section>

  <section id="vClosed" hidden>
    <div class="msg" id="closedMsg"><b>Rodada encerrada</b>Olhe para a tela.</div>
  </section>

  <div class="score" id="score" hidden></div>
  <p class="foot">Anônimo: não pedimos nome, e-mail nem login.<br><span id="sess"></span></p>
</main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
  var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  var sess=(new URLSearchParams(location.search).get('s')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,24);
  var $=function(id){return document.getElementById(id)};
  if(!sess){$('vWait').innerHTML='<div class="msg"><b>Link incompleto</b>Leia de novo o QR code da tela.</div>';return}
  $('sess').textContent='Sala '+sess;
  var BASE='andrecoura1-aula/'+sess;
  function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
  var me=store('voto.id');if(!me){me=Math.random().toString(36).slice(2,12);store('voto.id',me)}
  var mine=store('voto.'+sess)||{};   // rodada -> escolha
  var st={phase:'idle'},endAt=0,tick=null,clients=[];

  function setConn(){
    var n=clients.filter(function(c){return c.connected}).length;
    $('dot').className='dot '+(n?'on':'off');$('conn').textContent=n?'conectado':'reconectando…';
  }
  BROKERS.forEach(function(u){
    try{
      var c=mqtt.connect(u,{connectTimeout:8000,reconnectPeriod:2000,clean:true});
      c.on('connect',function(){c.subscribe(BASE+'/state');setConn()});
      c.on('close',setConn);c.on('offline',setConn);
      c.on('message',function(t,m){try{onState(JSON.parse(m.toString()))}catch(e){}});
      clients.push(c);
    }catch(e){}
  });
  setTimeout(setConn,9000);

  function onState(s){
    if(!s||!s.phase)return;
    if(s.id&&st.id===s.id&&s.seq<=st.seq)return;   // mesma mensagem vinda do outro servidor
    if(s.ep&&s.ep!==store('voto.ep.'+sess)){mine={};store('voto.'+sess,mine);store('voto.ans.'+sess,{});store('voto.ep.'+sess,s.ep)}
    st=s;
    if(s.title)$('title').textContent=s.title;
    if(s.phase==='open'){endAt=Date.now()+Math.max(0,s.left)*1000}
    render();
  }

  function vote(c){
    if(st.phase!=='open')return;
    mine[st.r]=c;store('voto.'+sess,mine);
    var msg=JSON.stringify({v:me,r:st.r,c:c});
    clients.forEach(function(cl){if(cl.connected)cl.publish(BASE+'/vote',msg)});
    if(navigator.vibrate)navigator.vibrate(30);
    render();
  }

  function render(){
    clearInterval(tick);
    $('vWait').hidden=st.phase!=='idle';
    $('vOpen').hidden=!(st.phase==='open'||st.phase==='closed'||st.phase==='reveal');
    $('vClosed').hidden=!(st.phase==='closed'||st.phase==='reveal');
    if(st.phase==='idle'){renderScore();return}
    var qq=String(st.q||'Qual é a falsa?').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]});
    $("q").innerHTML=qq.replace(/falsa/i,"<span style=\"color:#FF5A4E;text-transform:uppercase\">$&</span>");
    $('qsub').textContent=st.sub||'';
    var opts=st.opts||['1','2'],h='';
    opts.forEach(function(o,i){
      var n=i+1,cls='opt'+(mine[st.r]===n?' sel':'');
      if(st.phase==='reveal'&&st.ans)cls+=(n===st.ans?' right':(mine[st.r]===n?' wrong':''));
      h+='<button class="'+cls+'" data-c="'+n+'"'+(st.phase!=='open'?' disabled':'')+'>'+n+(o!==String(n)?'<small>'+o+'</small>':'')+'</button>';
    });
    $('opts').innerHTML=h;
    [].forEach.call($('opts').children,function(b){b.onclick=function(){vote(+b.dataset.c)}});
    $('voted').hidden=!(st.phase==='open'&&mine[st.r]);
    var tm=$('secs').parentNode;tm.hidden=st.phase!=='open';
    if(st.phase==='open'){
      var up=function(){var s=Math.max(0,Math.ceil((endAt-Date.now())/1000));$('secs').textContent=s;if(s<=0){clearInterval(tick);[].forEach.call($('opts').children,function(b){b.disabled=true})}};
      up();tick=setInterval(up,250);
    }
    if(st.phase==='closed')$('closedMsg').innerHTML=mine[st.r]?'<b>Voto registrado ✓</b>Você votou na '+mine[st.r]+'. '+(st.loop?'A próxima rodada abre já já.':'A resposta sai na tela.'):(st.loop?'<b>Rodada encerrada</b>Ela volta daqui a pouco. Fique com a página aberta.':'<b>Rodada encerrada</b>Olhe para a tela.');
    if(st.phase==='reveal'){
      var ok=mine[st.r]===st.ans;
      $('closedMsg').innerHTML=mine[st.r]?(ok?'<b>Você acertou ✅</b>':'<b>Não foi dessa vez ❌</b>')+'A resposta era a '+st.ans+'.':'<b>A resposta era a '+st.ans+'</b>Você não votou nesta rodada.';
      var key=store('voto.ans.'+sess)||{};key[st.r]=st.ans;store('voto.ans.'+sess,key);
    }
    renderScore();
  }
  function renderScore(){
    var key=store('voto.ans.'+sess)||{},n=st.rounds||0;if(!n){$('score').hidden=true;return}
    var h='';for(var r=1;r<=n;r++){var c=key[r]?(mine[r]?(mine[r]===key[r]?'ok':'no'):'nv'):'';h+='<i class="'+c+'"></i>'}
    $('score').innerHTML=h;$('score').hidden=false;
  }
})();
</script>
</body>
</html>
